[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prc-watermark"
version = "0.1.0"
description = "Pseudorandom code watermarks for language models"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.0", "scipy==1.14.1", "torch==2.4.0", "galois==0.4.2",
  "numba==0.59.1", "safetensors==0.4.5", "huggingface-hub==0.30.2",
  "tokenizers==0.21.1", "transformers==4.51.3"
]

[project.optional-dependencies]
benchmarks = ["datasets", "aiohttp", "nltk==3.9.1", "langdetect==1.0.9", "immutabledict==4.2.0", "absl-py"]
analysis = ["sacrebleu==2.4.3", "matplotlib==3.9.2"]

[tool.setuptools.packages.find]
include = ["prc_watermark*", "baselines*", "experiments*"]

[tool.setuptools.package-data]
"experiments" = ["environments.json"]
"experiments.detection" = ["*.json", "*.csv"]
"experiments.benchmarks" = ["*.json", "*.csv"]
"experiments.diversity" = ["*.json", "*.csv"]
"experiments.attacks" = ["*.json", "*.csv"]

"experiments.benchmarks.tasks.ifeval_lib" = ["NOTICE", "LICENSE"]

"baselines" = ["textseal_source.json", "wangetal_source.json", "wangetal_LICENSE"]
